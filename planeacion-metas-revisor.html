<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planeación — Revisor COMAPA</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="session.js"></script>
  <script src="mock-notifications.js"></script>
  <script src="mir-actividades-data.js"></script>
  <script src="layout.js"></script>
  <style>
    :root {
      --color-primary: #1D4ED8; --color-accent-dark: #1E3A8A;
      --color-bg: #FFFFFF; --color-surface: #F7F7F7;
      --color-border: #E5E7EB; --color-text-primary: #111827;
      --color-text-secondary: #6B7280; --color-avatar-bg: #3B82F6;
      --radius-card: 16px; --radius-btn: 999px;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--color-surface); color: var(--color-text-primary); display: flex; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar { width: 148px; background: var(--color-bg); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; align-items: stretch; padding: 16px 0; gap: 4px; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; }
    .sidebar-logo { width: 36px; height: 36px; background: var(--color-primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .sidebar-logo svg { width: 18px; height: 18px; stroke: white; }
    .sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; align-items: stretch; padding: 0 8px; }
    .nav-item { width: 100%; height: auto; padding: 7px 10px; border-radius: 12px; display: flex; align-items: center; justify-content: flex-start; flex-direction: row; gap: 8px; cursor: pointer; color: var(--color-text-secondary); transition: background .15s, color .15s; position: relative; text-decoration: none; }
    .nav-item:hover { background: var(--color-surface); }
    .nav-item.active { background: #EFF6FF; color: var(--color-primary); }
    .nav-label { font-size: 11px; font-weight: 600; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .nav-badge { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #EF4444; border: 1.5px solid #fff; }
    .sidebar-bottom { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 8px; }
    .avatar-xs { width: 32px; height: 32px; border-radius: 50%; background: var(--color-avatar-bg); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: white; cursor: pointer; }

    /* LAYOUT */
    .app-wrapper { display: flex; flex: 1; margin-left: 148px; }
    .main-content { flex: 1; padding: 24px; min-width: 0; max-width: 1000px; }

    /* PAGE HEADER */
    .page-header { margin-bottom: 20px; }
    .page-title { font-size: 22px; font-weight: 700; }
    .page-subtitle { font-size: 13px; color: var(--color-text-secondary); margin-top: 3px; }

    /* STATS */
    .stats-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-chip { display: flex; align-items: center; gap: 10px; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 12px; padding: 12px 16px; }
    .stat-num { font-size: 22px; font-weight: 700; line-height: 1; }
    .stat-lbl { font-size: 11px; font-weight: 600; color: var(--color-text-secondary); margin-top: 2px; }
    .stat-chip.blue .stat-num { color: #1D4ED8; }
    .stat-chip.green .stat-num { color: #16A34A; }
    .stat-chip.red .stat-num { color: #DC2626; }

    /* LIST */
    .list-wrap { display: flex; flex-direction: column; gap: 10px; }
    .ind-row { background: var(--color-bg); border-radius: 14px; border: 1px solid var(--color-border); padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .ind-row:hover { border-color: #BFDBFE; box-shadow: 0 2px 10px rgba(29,78,216,.07); }
    .ind-row.aprobado { border-left: 4px solid #22C55E; }
    .ind-row.rechazado { border-left: 4px solid #EF4444; }
    .ind-id-mono { font-family: monospace; font-size: 11px; font-weight: 700; color: var(--color-text-secondary); white-space: nowrap; flex-shrink: 0; }
    .ind-nombre { font-size: 13px; font-weight: 600; color: var(--color-text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ind-badges { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .pill { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: var(--radius-btn); white-space: nowrap; }
    .pill.freq { background: #EFF6FF; color: #1D4ED8; }
    .pill.nivel-fin { background: #EDE9FE; color: #7C3AED; }
    .pill.nivel-proposito { background: #DBEAFE; color: #1D4ED8; }
    .pill.nivel-componente { background: #CCFBF1; color: #0F766E; }
    .pill.nivel-actividad { background: #F3F4F6; color: #374151; }
    .pill.pendiente { background: #EFF6FF; color: #1D4ED8; }
    .pill.aprobado { background: #D1FAE5; color: #065F46; }
    .pill.rechazado { background: #FEE2E2; color: #DC2626; }
    .btn-revisar { font-size: 12px; font-weight: 600; font-family: inherit; padding: 7px 16px; border-radius: var(--radius-btn); border: none; cursor: pointer; flex-shrink: 0; transition: background .15s; }
    .btn-revisar.blue { background: #EFF6FF; color: #1D4ED8; }
    .btn-revisar.blue:hover { background: #DBEAFE; }
    .btn-revisar.green { background: #D1FAE5; color: #065F46; }
    .btn-revisar.green:hover { background: #A7F3D0; }

    /* MODAL BASE */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-card { background: var(--color-bg); border-radius: 20px; width: min(900px, 100%); max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.2); overflow: hidden; }

    /* MODAL HEADER */
    .modal-header { padding: 20px 24px 14px; flex-shrink: 0; display: flex; align-items: flex-start; gap: 12px; border-bottom: 1px solid var(--color-border); }
    .mh-info { flex: 1; min-width: 0; }
    .mh-id { font-family: monospace; font-size: 11px; font-weight: 700; color: var(--color-primary); margin-bottom: 3px; }
    .mh-name { font-size: 15px; font-weight: 700; line-height: 1.3; }
    .mh-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .mh-sub { font-size: 11px; color: var(--color-text-secondary); }
    .modal-close { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--color-border); background: white; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--color-text-secondary); flex-shrink: 0; transition: background .12s; }
    .modal-close:hover { background: var(--color-surface); }

    /* TWO-COLUMN MODAL BODY */
    .modal-cols { display: flex; flex: 1; overflow: hidden; min-height: 0; }
    .col-left { width: 42%; background: #F9FAFB; border-right: 1px solid var(--color-border); overflow-y: auto; padding: 20px; flex-shrink: 0; }
    .col-right { flex: 1; overflow-y: auto; padding: 20px; }
    .col-section-title { font-size: 10px; font-weight: 700; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
    .col-section-title svg { width: 12px; height: 12px; flex-shrink: 0; }
    .readonly-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; background: #F3F4F6; color: #6B7280; padding: 3px 9px; border-radius: 999px; margin-bottom: 14px; }
    .info-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-bottom: 10px; }
    .info-item { min-width: 0; }
    .info-label { font-size: 10px; font-weight: 600; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
    .info-value { font-size: 13px; color: var(--color-text-primary); line-height: 1.4; }
    .info-divider { height: 1px; background: var(--color-border); margin: 12px 0; }
    .nivel-badge { display: inline-flex; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
    .nivel-fin { background: #EDE9FE; color: #7C3AED; }
    .nivel-proposito { background: #DBEAFE; color: #1D4ED8; }
    .nivel-componente { background: #CCFBF1; color: #0F766E; }
    .nivel-actividad { background: #F3F4F6; color: #374151; }

    /* META READONLY */
    .enlace-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; background: #EFF6FF; color: #1D4ED8; padding: 3px 9px; border-radius: 999px; margin-bottom: 14px; }
    .meta-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-bottom: 16px; }
    .meta-kpi { background: #F9FAFB; border: 1px solid var(--color-border); border-radius: 10px; padding: 10px 12px; }
    .meta-kpi-label { font-size: 10px; font-weight: 600; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .meta-kpi-value { font-size: 18px; font-weight: 700; color: var(--color-text-primary); }
    .period-grid { display: grid; gap: 8px; margin-top: 8px; }
    .period-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .period-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .period-grid.cols-1 { grid-template-columns: 1fr; }
    .period-cell-ro { background: #F9FAFB; border: 1px solid var(--color-border); border-radius: 8px; padding: 8px 10px; }
    .period-cell-ro-label { font-size: 10px; font-weight: 700; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 3px; }
    .period-cell-ro-value { font-size: 14px; font-weight: 700; color: var(--color-text-primary); }

    /* DECISION AREA */
    .decision-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--color-border); }
    .decision-title { font-size: 12px; font-weight: 700; color: var(--color-text-primary); margin-bottom: 10px; }
    .obs-textarea { width: 100%; padding: 10px 12px; font-size: 12px; font-family: inherit; border: 1px solid var(--color-border); border-radius: 10px; resize: vertical; min-height: 80px; outline: none; line-height: 1.5; transition: border-color .15s; margin-bottom: 12px; }
    .obs-textarea:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(29,78,216,.07); }
    .decision-btns { display: flex; gap: 8px; }
    .btn-approve { background: #D1FAE5; color: #065F46; border: none; border-radius: var(--radius-btn); padding: 10px 18px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .15s; flex: 1; justify-content: center; }
    .btn-approve:hover { background: #A7F3D0; }
    .btn-reject { background: #FEE2E2; color: #DC2626; border: none; border-radius: var(--radius-btn); padding: 10px 18px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .15s; flex: 1; justify-content: center; }
    .btn-reject:hover { background: #FECACA; }
    .decided-notice { border-radius: 12px; padding: 14px 16px; display: flex; align-items: flex-start; gap: 10px; font-size: 12px; margin-bottom: 12px; }
    .decided-notice svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
    .decided-notice.approved { background: #D1FAE5; border: 1px solid #6EE7B7; color: #065F46; }
    .decided-notice.rejected { background: #FEE2E2; border: 1px solid #FECACA; color: #DC2626; }
    .btn-undo { background: var(--color-surface); color: var(--color-text-secondary); border: 1px solid var(--color-border); border-radius: var(--radius-btn); padding: 8px 16px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; }
    .btn-undo:hover { background: var(--color-border); }

    /* MODAL FOOTER */
    .modal-footer { padding: 14px 24px; border-top: 1px solid var(--color-border); flex-shrink: 0; display: flex; justify-content: flex-end; }
    .btn-cancel { padding: 10px 16px; background: var(--color-surface); color: var(--color-text-secondary); border: none; border-radius: var(--radius-btn); font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; transition: background .12s; }
    .btn-cancel:hover { background: var(--color-border); }

    /* TOAST */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px); background: #1F2937; color: white; font-size: 13px; font-weight: 500; padding: 10px 20px; border-radius: var(--radius-btn); opacity: 0; transition: all .25s; z-index: 2000; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: #065F46; }
    .toast.warn { background: #92400E; }
  </style>
</head>

<script>
  var PERIODOS = {
    'Mensual':    { labels: ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'], cols: 3 },
    'Bimestral':  { labels: ['Ene–Feb','Mar–Abr','May–Jun','Jul–Ago','Sep–Oct','Nov–Dic'], cols: 2 },
    'Trimestral': { labels: ['T1 (Ene–Mar)','T2 (Abr–Jun)','T3 (Jul–Sep)','T4 (Oct–Dic)'], cols: 2 },
    'Semestral':  { labels: ['S1 (Ene–Jun)','S2 (Jul–Dic)'], cols: 2 },
    'Anual':      { labels: ['Ejercicio 2026'], cols: 1 },
  };

  var MOCK_METAS = {
    'Mensual':    { lineaBase: '85%', metaAnual: '92%', periodos: ['88%','89%','89%','90%','91%','92%','92%','92%','92%','92%','92%','92%'] },
    'Trimestral': { lineaBase: '82%', metaAnual: '90%', periodos: ['85%','87%','89%','90%'] },
    'Semestral':  { lineaBase: '80%', metaAnual: '88%', periodos: ['84%','88%'] },
    'Anual':      { lineaBase: '78%', metaAnual: '95%', periodos: ['95%'] },
    'Bimestral':  { lineaBase: '81%', metaAnual: '91%', periodos: ['86%','88%','89%','90%','91%','91%'] },
  };

  function getDisplayIndicators() {
    var freqCount = {};
    var result = [];
    ACTIVIDADES_ENLACE.forEach(function(a) {
      var f = a.frecuenciaMedicion || 'Mensual';
      if (!freqCount[f]) freqCount[f] = 0;
      if (freqCount[f] < 1) {
        freqCount[f]++;
        var mock = MOCK_METAS[f] || MOCK_METAS['Mensual'];
        result.push(Object.assign({}, a, {
          lineaBaseConfig: mock.lineaBase,
          metaAnualConfig: mock.metaAnual,
          periodosConfig:  mock.periodos.slice(),
        }));
      }
    });
    return result;
  }

  var ALL = getDisplayIndicators();
  var DECISIONS = {};
  var activeId  = null;
  var _toastTimer;

  function nivelBadge(nivel) {
    var map = {
      'Fin':        ['nivel-fin',        'Fin'],
      'Propósito':  ['nivel-proposito',  'Propósito'],
      'Componente': ['nivel-componente', 'Componente'],
      'Actividad':  ['nivel-actividad',  'Actividad'],
    };
    var n = map[nivel] || ['nivel-actividad', nivel || '—'];
    return '<span class="nivel-badge ' + n[0] + '">' + n[1] + '</span>';
  }

  function pillNivel(nivel) {
    var map = { 'Fin':'nivel-fin', 'Propósito':'nivel-proposito', 'Componente':'nivel-componente', 'Actividad':'nivel-actividad' };
    return 'pill ' + (map[nivel] || 'nivel-actividad');
  }

  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (type ? ' ' + type : '');
    t.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3200);
  }

  // ── Lista ──────────────────────────────────────────────────────────────────────
  function renderList() {
    var pending  = ALL.filter(function(a) { return !DECISIONS[a.id]; }).length;
    var approved = ALL.filter(function(a) { return DECISIONS[a.id] === 'aprobado'; }).length;
    var rejected = ALL.filter(function(a) { return DECISIONS[a.id] === 'rechazado'; }).length;

    document.getElementById('statsRow').innerHTML =
      '<div class="stat-chip blue"><div><div class="stat-num">' + pending + '</div><div class="stat-lbl">Pendientes de validar</div></div></div>' +
      '<div class="stat-chip green"><div><div class="stat-num">' + approved + '</div><div class="stat-lbl">Metas aprobadas</div></div></div>' +
      '<div class="stat-chip red"><div><div class="stat-num">' + rejected + '</div><div class="stat-lbl">Metas rechazadas</div></div></div>';

    document.getElementById('listWrap').innerHTML = ALL.map(function(a) {
      var decision    = DECISIONS[a.id];
      var statusCls   = decision || 'pendiente';
      var statusLabel = decision === 'aprobado' ? 'Aprobado' : (decision === 'rechazado' ? 'Rechazado' : 'Pendiente validación');
      var rowCls      = decision ? ' ' + decision : '';
      var btnCls      = decision === 'aprobado' ? 'green' : 'blue';
      var btnLabel    = decision ? 'Ver detalle' : 'Revisar →';

      return '<div class="ind-row' + rowCls + '" onclick="openModal(\'' + a.id + '\')">' +
        '<span class="ind-id-mono">' + a.id + '</span>' +
        '<span class="ind-nombre">' + a.nombreIndicador + '</span>' +
        '<div class="ind-badges">' +
          '<span class="' + pillNivel(a.nivel) + '">' + (a.nivel || '—') + '</span>' +
          '<span class="pill freq">' + (a.frecuenciaMedicion || '—') + '</span>' +
          '<span class="pill ' + statusCls + '">' + statusLabel + '</span>' +
        '</div>' +
        '<button class="btn-revisar ' + btnCls + '" onclick="event.stopPropagation();openModal(\'' + a.id + '\')">' + btnLabel + '</button>' +
      '</div>';
    }).join('');
  }

  // ── Modal ──────────────────────────────────────────────────────────────────────
  function openModal(id) {
    var act = ALL.find(function(a) { return a.id === id; });
    if (!act) return;
    activeId = id;

    document.getElementById('mhId').textContent   = act.id;
    document.getElementById('mhName').textContent = act.nombreIndicador;
    document.getElementById('mhMeta').innerHTML   =
      nivelBadge(act.nivel) +
      '<span class="mh-sub">·</span>' +
      '<span class="mh-sub">' + (act.frecuenciaMedicion || '—') + '</span>' +
      (act.unidadResponsable ? '<span class="mh-sub">·</span><span class="mh-sub">' + act.unidadResponsable + '</span>' : '');

    document.getElementById('adminInfoPanel').innerHTML = buildAdminPanel(act);
    document.getElementById('metaPanel').innerHTML      = buildMetaPanel(act);
    document.getElementById('decisionPanel').innerHTML  = buildDecisionPanel(id);

    document.getElementById('cfgModal').classList.add('open');
  }

  function buildAdminPanel(act) {
    var LOCK = '<svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="11" height="11"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>';
    var html = '<div class="readonly-badge">' + LOCK + ' Configurado por Admin</div>';

    html += '<div style="margin-bottom:10px"><p class="info-label">Nombre del indicador</p>' +
            '<p class="info-value" style="font-weight:600;line-height:1.4">' + act.nombreIndicador + '</p></div>';
    html += '<div class="info-divider"></div>';
    html += '<div class="info-row">' +
              '<div class="info-item"><p class="info-label">Nivel MIR</p><p class="info-value">' + nivelBadge(act.nivel) + '</p></div>' +
              '<div class="info-item"><p class="info-label">Unidad responsable</p><p class="info-value">' + (act.unidadResponsable || act.gerencia || '—') + '</p></div>' +
            '</div>';
    html += '<div class="info-row">' +
              '<div class="info-item"><p class="info-label">Frecuencia</p><p class="info-value">' + (act.frecuenciaMedicion || '—') + '</p></div>' +
              '<div class="info-item"><p class="info-label">Unidad de medida</p><p class="info-value">' + (act.unidadMedida || '—') + '</p></div>' +
            '</div>';
    html += '<div class="info-row">' +
              '<div class="info-item"><p class="info-label">Tipo</p><p class="info-value">' + (act.acumulable ? 'Acumulable' : 'No acumulable') + '</p></div>' +
              '<div class="info-item"><p class="info-label">Cálculo</p><p class="info-value">' + (act.tieneDenominador ? 'Fracción' : 'Valor directo') + '</p></div>' +
            '</div>';
    if (act.tieneDenominador) {
      html += '<div class="info-row">' +
                '<div class="info-item"><p class="info-label">Numerador</p><p class="info-value">' + (act.numerador || '—') + '</p></div>' +
                '<div class="info-item"><p class="info-label">Denominador</p><p class="info-value">' + (act.denominador || '—') + '</p></div>' +
              '</div>';
    }
    if (act.metodoCalculo) {
      html += '<div class="info-divider"></div>' +
              '<div style="margin-bottom:10px"><p class="info-label">Fórmula</p>' +
              '<p class="info-value" style="font-family:monospace;font-size:12px;background:#F3F4F6;padding:5px 10px;border-radius:6px;display:inline-block">' + act.metodoCalculo + '</p></div>';
    }
    if (act.medioVerificacion) {
      html += '<div style="margin-bottom:10px"><p class="info-label">Medio de verificación</p><p class="info-value">' + act.medioVerificacion + '</p></div>';
    }
    if (act.resumenNarrativo) {
      html += '<div class="info-divider"></div>' +
              '<div><p class="info-label">Descripción</p>' +
              '<p class="info-value" style="font-size:12px;color:var(--color-text-secondary);line-height:1.6">' + act.resumenNarrativo + '</p></div>';
    }
    return html;
  }

  function buildMetaPanel(act) {
    var pDef = PERIODOS[act.frecuenciaMedicion || 'Mensual'] || PERIODOS['Mensual'];
    var LINK = '<svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="11" height="11"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/></svg>';
    var html = '<div class="enlace-badge">' + LINK + ' Configurado por Enlace · AT</div>';

    html += '<div class="meta-summary">' +
              '<div class="meta-kpi"><p class="meta-kpi-label">Línea base</p><p class="meta-kpi-value">' + act.lineaBaseConfig + '</p></div>' +
              '<div class="meta-kpi"><p class="meta-kpi-label">Meta anual</p><p class="meta-kpi-value">' + act.metaAnualConfig + '</p></div>' +
            '</div>';

    html += '<p class="info-label" style="margin-bottom:6px">Distribución por período · ' + (act.frecuenciaMedicion || 'Mensual') + '</p>';
    var cells = pDef.labels.map(function(lbl, i) {
      var val = (act.periodosConfig && act.periodosConfig[i]) || '—';
      return '<div class="period-cell-ro">' +
               '<p class="period-cell-ro-label">' + lbl + '</p>' +
               '<p class="period-cell-ro-value">' + val + '</p>' +
             '</div>';
    }).join('');
    html += '<div class="period-grid cols-' + pDef.cols + '">' + cells + '</div>';

    return html;
  }

  function buildDecisionPanel(id) {
    var decision = DECISIONS[id];
    var html = '<div class="decision-section">';

    if (decision === 'aprobado') {
      html += '<div class="decided-notice approved">' +
                '<svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>' +
                '<div><strong>Meta aprobada.</strong> Tu validación fue registrada correctamente.</div>' +
              '</div>' +
              '<button class="btn-undo" onclick="undoDecision(\'' + id + '\')">Deshacer</button>';
    } else if (decision === 'rechazado') {
      html += '<div class="decided-notice rejected">' +
                '<svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>' +
                '<div><strong>Meta rechazada.</strong> Se enviaron tus comentarios al enlace.</div>' +
              '</div>' +
              '<button class="btn-undo" onclick="undoDecision(\'' + id + '\')">Deshacer</button>';
    } else {
      html += '<p class="decision-title">Tu decisión</p>' +
              '<textarea class="obs-textarea" id="obsTA" placeholder="Comentarios (requeridos si rechazas, opcionales si apruebas)…"></textarea>' +
              '<div class="decision-btns">' +
                '<button class="btn-approve" onclick="approveIndicator(\'' + id + '\')">' +
                  '<svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" width="14" height="14"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>' +
                  'Aprobar meta' +
                '</button>' +
                '<button class="btn-reject" onclick="rejectIndicator(\'' + id + '\')">' +
                  '<svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" width="14" height="14"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>' +
                  'Rechazar' +
                '</button>' +
              '</div>';
    }

    html += '</div>';
    return html;
  }

  function approveIndicator(id) {
    DECISIONS[id] = 'aprobado';
    document.getElementById('decisionPanel').innerHTML = buildDecisionPanel(id);
    showToast('Meta aprobada', 'success');
    renderList();
  }

  function rejectIndicator(id) {
    var obs = ((document.getElementById('obsTA') || {}).value || '').trim();
    if (!obs) { showToast('Escribe tus comentarios antes de rechazar', 'warn'); return; }
    DECISIONS[id] = 'rechazado';
    document.getElementById('decisionPanel').innerHTML = buildDecisionPanel(id);
    showToast('Meta rechazada — comentarios enviados al enlace', 'warn');
    renderList();
  }

  function undoDecision(id) {
    delete DECISIONS[id];
    document.getElementById('decisionPanel').innerHTML = buildDecisionPanel(id);
    renderList();
  }

  function closeModal() {
    document.getElementById('cfgModal').classList.remove('open');
    activeId = null;
  }

  // ── Auth + Init ────────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function() {
    var u = (typeof Session !== 'undefined' && Session.requireAuth) ? Session.requireAuth() : null;
    if (u) { document.getElementById('avatarEl').textContent = u.iniciales || 'CM'; }
    renderList();
  });
</script>
</body>
</html>

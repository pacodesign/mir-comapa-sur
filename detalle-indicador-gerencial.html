<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--color-surface); color: var(--color-text-primary); display: flex; min-height: 100vh; }
.page-content { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
/* ── BREADCRUMB ── */
.breadcrumb { display: flex; align-items: center; gap: 6px; }
.breadcrumb a { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); text-decoration: none; transition: color .15s; }
.breadcrumb a:hover { color: var(--color-primary); }
.breadcrumb .sep { font-size: 12px; color: var(--color-border); }
.breadcrumb .current { font-size: 12px; font-weight: 700; color: var(--color-text-primary); }
/* ── TWO-COLUMN LAYOUT ── */
.detail-layout { display: grid; grid-template-columns: 30% 1fr; gap: 16px; align-items: start; }
/* ════════════════════════════════════════
   LEFT PANEL — indicator info
   ════════════════════════════════════════ */
/* single unified card */
.info-panel { position: sticky; top: 24px; background: var(--color-bg); border-radius: var(--radius-card); padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: flex; flex-direction: column; gap: 0; }
.ind-id-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.ind-id { font-size: 10px; font-weight: 700; font-family: monospace; color: var(--color-text-secondary); background: var(--color-surface); padding: 3px 8px; border-radius: 7px; }
.ger-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: var(--radius-btn); background: var(--color-success-tint); color: var(--color-success-dark); white-space: nowrap; }
/* name section */
.ind-name-card { padding-bottom: 16px; border-bottom: 1px solid var(--color-border); margin-bottom: 0; }
.ind-name-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--color-text-secondary); margin-bottom: 8px; }
.ind-name-text { font-size: 14px; font-weight: 700; color: var(--color-text-primary); line-height: 1.5; }
/* meta rows (no separate card) */
.meta-card { display: flex; flex-direction: column; gap: 0; }
.meta-row { display: flex; flex-direction: column; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--color-border); }
.meta-row:last-child { border-bottom: none; padding-bottom: 0; }
.meta-lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--color-text-secondary); }
.meta-val { font-size: 12px; font-weight: 600; color: var(--color-text-primary); line-height: 1.4; }
.meta-val.muted { color: var(--color-text-secondary); font-weight: 400; font-style: italic; }
/* chips */
.chip-row { display: flex; gap: 5px; flex-wrap: wrap; }
.g-chip { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: var(--radius-btn); background: var(--color-neutral-100); color: var(--color-text-secondary); white-space: nowrap; }
.freq-chip { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: var(--radius-btn); background: var(--color-info-tint); color: var(--color-info); white-space: nowrap; }
.den-chip { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: var(--radius-btn); white-space: nowrap; }
.den-chip.con { background: var(--color-neutral-100); color: var(--color-text-primary); border: 1px solid var(--color-neutral-300); }
.den-chip.sin { background: var(--color-neutral-100); color: var(--color-text-muted); border: 1px solid var(--color-border); }
/* variable block */
.var-block { background: var(--color-surface); border-radius: 10px; padding: 10px 12px; }
.var-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 4px; }
.var-label.x { color: var(--color-primary); }
.var-label.y { color: var(--color-text-secondary); }
.var-val { font-size: 11px; color: var(--color-text-primary); line-height: 1.4; }
/* ════════════════════════════════════════
   RIGHT PANEL — reporting interaction
   ════════════════════════════════════════ */
.report-panel { display: flex; flex-direction: column; gap: 16px; }
/* period header */
.period-header { background: var(--color-bg); border-radius: var(--radius-card); padding: 18px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.period-title { font-size: 15px; font-weight: 700; color: var(--color-text-primary); }
.period-meta { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
.status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: var(--radius-btn); font-size: 11px; font-weight: 700; white-space: nowrap; }
.status-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.status-pending { background: var(--color-warning-tint); color: var(--color-warning-dark); }
.status-pending::before { background: var(--color-warning); }
/* avance section */
.avance-section { background: var(--color-bg); border-radius: var(--radius-card); padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.section-heading { font-size: 13px; font-weight: 700; color: var(--color-text-primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.section-heading svg { width: 15px; height: 15px; color: var(--color-primary); flex-shrink: 0; }
.avance-ctx-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.ctx-pill { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; padding: 5px 11px; font-size: 11px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 4px; }
.ctx-pill strong { color: var(--color-text-primary); font-weight: 700; }
.avance-input-wrap { margin-bottom: 16px; }
.avance-input-label { font-size: 12px; font-weight: 600; color: var(--color-text-primary); display: block; margin-bottom: 10px; }
.avance-inp-row { display: flex; align-items: center; gap: 10px; }
.avance-inp { background: var(--color-bg); border: 2px solid var(--color-border); border-radius: 12px; padding: 12px 16px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700; color: var(--color-text-primary); outline: none; transition: border-color .15s, box-shadow .15s; width: 200px; }
.avance-inp:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(139,29,58,.08); }
.avance-unit { font-size: 18px; font-weight: 700; color: var(--color-text-secondary); }
.avance-hint { font-size: 11px; color: var(--color-text-secondary); margin-top: 8px; line-height: 1.5; }
.avance-actions { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
.saved-msg { display: none; align-items: center; gap: 8px; padding: 10px 14px; background: var(--color-success-tint); border: 1px solid #BBF7D0; border-radius: 10px; font-size: 12px; color: var(--color-success-dark); font-weight: 600; margin-top: 12px; }
.saved-msg svg { width: 14px; height: 14px; flex-shrink: 0; }
/* meta context card */
.meta-context-card { background: var(--color-bg); border-radius: var(--radius-card); padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.meta-kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.meta-kpi { background: var(--color-surface); border-radius: 12px; padding: 14px 16px; text-align: center; }
.meta-kpi-num { font-size: 28px; font-weight: 700; color: var(--color-text-primary); line-height: 1; margin-bottom: 4px; }
.meta-kpi-num.accent { color: var(--color-primary); }
.meta-kpi-lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-secondary); }
.pending-tag { display: inline-flex; align-items: center; gap: 5px; background: var(--color-neutral-100); color: var(--color-text-secondary); font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: var(--radius-btn); margin-bottom: 2px; }
.pending-tag svg { width: 11px; height: 11px; }
/* history section */
.history-section { background: var(--color-bg); border-radius: var(--radius-card); padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.hist-period-list { border: 1px solid var(--color-border); border-radius: 12px; overflow: hidden; margin-top: 12px; }
.hist-period-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--color-border); gap: 12px; }
.hist-period-item:last-child { border-bottom: none; }
.hist-period-num { font-size: 13px; font-weight: 600; color: var(--color-text-primary); }
.hist-period-meta { font-size: 11px; color: var(--color-text-secondary); margin-top: 1px; }
.hist-period-value-ok { font-size: 13px; font-weight: 700; color: var(--color-success-dark); }

@keyframes hist-appear {
  from { opacity: 0; transform: translateY(-6px); background: rgba(139,29,58,.1); }
  60%  { background: rgba(139,29,58,.06); }
  to   { opacity: 1; transform: translateY(0); background: var(--color-success-tint); }
}.hist-period-item--new { animation: hist-appear .5s ease-out forwards; }
/* bottom bar */
.bottom-bar { background: var(--color-bg); border-radius: var(--radius-card); padding: 14px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bottom-bar-info { font-size: 11px; color: var(--color-text-secondary); }
.bottom-bar-info strong { color: var(--color-text-primary); }
.bottom-bar-actions { display: flex; gap: 8px; }
@media (max-width: 900px) {
.detail-layout { grid-template-columns: 1fr; }
.info-panel { position: static; }
}
</style>

<script>
(function () {
  var avanceVal = '';

  window.onAvanceInput = function (val) {
    avanceVal = val;
    var btn = document.getElementById('saveBtn');
    if (btn) btn.disabled = !val.trim();
  };

  window.saveAvance = function () {
    if (!avanceVal.trim()) return;
    var btn = document.getElementById('saveBtn');
    var msg = document.getElementById('savedMsg');
    var valEl = document.getElementById('savedVal');
    if (btn) { btn.disabled = true; btn.innerHTML = '<svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="13" height="13"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>Guardado'; }
    if (valEl) valEl.textContent = avanceVal;
    if (msg) msg.style.display = 'flex';

    /* push saved value into history list with micro-animation */
    var newItem = document.createElement('div');
    newItem.className = 'hist-period-item hist-period-item--new';
    newItem.innerHTML =
      '<div>' +
        '<p class="hist-period-num">' + periodoLabel + '</p>' +
      '</div>' +
      '<span class="hist-period-value-ok">' + avanceVal + (r.unidadMedida ? ' ' + r.unidadMedida : '') + '</span>';

    var list = document.querySelector('.hist-period-list');
    if (list) {
      list.appendChild(newItem);
    } else {
      var section = document.createElement('div');
      section.className = 'history-section';
      section.innerHTML =
        '<p class="section-heading">' +
          '<svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>' +
          'Avances registrados' +
        '</p>' +
        '<div class="hist-period-list"></div>';
      var panel = document.querySelector('.report-panel');
      if (panel) panel.appendChild(section);
      section.querySelector('.hist-period-list').appendChild(newItem);
    }
  };

  var params = new URLSearchParams(window.location.search);
  var id = params.get('id') || 'GER-COM-001';
  var r = (typeof ACTIVIDADES_GERENCIA !== 'undefined' ? ACTIVIDADES_GERENCIA : []).find(function (x) { return x.id === id; });
  var page = document.getElementById('pageContent');

  if (!r) {
    page.innerHTML = '<p style="padding:48px 24px;color:var(--color-text-secondary);text-align:center">Indicador no encontrado: ' + id + '</p>';
    return;
  }

  document.title = r.id + ' — Indicador Gerencial · COMAPA Sur';

  var frecMap = { Mensual: '12', Trimestral: '4', Semestral: '2', Anual: '1', Bimestral: '6' };
  var frecN = frecMap[r.frecuenciaMedicion] || '—';
  var periodoLabel = { Mensual: 'Agosto 2026', Bimestral: 'Jul–Ago 2026', Trimestral: 'Q3 2026', Semestral: 'Segundo semestre 2026', Anual: '2026' }[r.frecuenciaMedicion] || 'Agosto 2026';
  var isPercent = (r.unidadMedida || '').toLowerCase().includes('porcentaje') || (r.unidadMedida || '').includes('%');
  var uShort = isPercent ? '%' : '';
  var indExample = isPercent ? '78.5' : '142';

  var PENDING = '<span class="pending-tag"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>Pendiente</span>';

  /* ── frequency-aware past periods ── */
  var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var HOY = { year: 2026, month: 7 }; // August 2026 (0-indexed)

  function getPastPeriods(freq) {
    var periods = [];
    if (freq === 'Mensual') {
      for (var i = 0; i < HOY.month; i++) {
        periods.push(MESES[i] + ' ' + HOY.year);
      }
    } else if (freq === 'Bimestral') {
      var bimLabels = ['Ene–Feb','Mar–Abr','May–Jun','Jul–Ago','Sep–Oct','Nov–Dic'];
      var curBim = Math.floor(HOY.month / 2);
      for (var i = 0; i < curBim; i++) {
        periods.push('Bimestre ' + (i + 1) + ' ' + HOY.year + ' · ' + bimLabels[i]);
      }
    } else if (freq === 'Trimestral') {
      var qLabels = ['Ene–Mar','Abr–Jun','Jul–Sep','Oct–Dic'];
      var curQ = Math.floor(HOY.month / 3);
      for (var i = 0; i < curQ; i++) {
        periods.push('Q' + (i + 1) + ' ' + HOY.year + ' · ' + qLabels[i]);
      }
    } else if (freq === 'Semestral') {
      if (HOY.month >= 6) {
        periods.push('Semestre 1 ' + HOY.year + ' · Ene–Jun');
      }
    }
    return periods;
  }

  var pastPeriods = getPastPeriods(r.frecuenciaMedicion);
  var histHTML = '';
  if (pastPeriods.length > 0) {
    var itemsHTML = pastPeriods.map(function (p) {
      var parts = p.split(' · ');
      var main = parts[0];
      var sub = parts[1] || '';
      return '<div class="hist-period-item">' +
        '<div>' +
          '<p class="hist-period-num">' + main + '</p>' +
          (sub ? '<p class="hist-period-meta">' + sub + '</p>' : '') +
        '</div>' +
        PENDING +
      '</div>';
    }).join('');
    histHTML =
      '<div class="history-section">' +
        '<p class="section-heading">' +
          '<svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>' +
          'Avances registrados' +
        '</p>' +
        '<div class="hist-period-list">' + itemsHTML + '</div>' +
      '</div>';
  }

  /* ── left panel: variable blocks ── */
  var varBlocks;
  if (r.tieneDenominador) {
    varBlocks =
      '<div class="var-block" style="margin-bottom:6px">' +
        '<p class="var-label x">Variable X — Numerador</p>' +
        '<p class="var-val">' + (r.numerador || '—') + '</p>' +
      '</div>' +
      '<div style="text-align:center;font-size:18px;font-weight:700;color:var(--color-text-secondary);padding:2px 0">÷</div>' +
      '<div class="var-block" style="margin-top:6px">' +
        '<p class="var-label y">Variable Y — Denominador</p>' +
        '<p class="var-val">' + (r.denominador || '—') + '</p>' +
      '</div>';
  } else {
    varBlocks =
      '<div class="var-block">' +
        '<p class="var-label x">Variable X — Valor directo</p>' +
        '<p class="var-val">' + (r.numerador || '—') + '</p>' +
      '</div>' +
      '<p style="font-size:10px;color:var(--color-text-secondary);margin-top:6px">Sin denominador — se reporta el valor absoluto</p>';
  }

  var html =
/* breadcrumb */
'<div class="breadcrumb">' +
  '<a href="dashboard-enlace.html">Inicio</a>' +
  '<span class="sep">›</span>' +
  '<a href="mis-actividades.html">Mis indicadores</a>' +
  '<span class="sep">›</span>' +
  '<span class="current">' + r.id + '</span>' +
'</div>' +

/* two-column */
'<div class="detail-layout">' +

  /* ══ LEFT PANEL ══ */
  '<div class="info-panel">' +

    '<div class="ind-id-row">' +
      '<span class="ind-id">' + r.id + '</span>' +
      '<span class="ger-badge">Gerencial</span>' +
    '</div>' +

    '<div class="ind-name-card">' +
      '<p class="ind-name-label">Nombre del indicador</p>' +
      '<p class="ind-name-text">' + r.nombreIndicador + '</p>' +
    '</div>' +

    '<div class="meta-card">' +
      '<div class="meta-row">' +
        '<p class="meta-lbl">Unidad Responsable</p>' +
        '<p class="meta-val"><span class="g-chip">' + (r.area || '—') + '</span></p>' +
        '<p class="meta-val muted" style="margin-top:4px">' + r.gerencia + '</p>' +
      '</div>' +
      '<div class="meta-row">' +
        '<p class="meta-lbl">Frecuencia</p>' +
        '<div class="chip-row"><span class="freq-chip">' + r.frecuenciaMedicion + '</span></div>' +
        '<p class="meta-val muted" style="margin-top:4px">' + frecN + ' reporte' + (frecN !== '1' ? 's' : '') + ' al año</p>' +
      '</div>' +
      '<div class="meta-row">' +
        '<p class="meta-lbl">Unidad de medida</p>' +
        '<p class="meta-val">' + r.unidadMedida + '</p>' +
      '</div>' +
      '<div class="meta-row">' +
        '<p class="meta-lbl">Variables de medición</p>' +
        '<div style="margin-top:6px">' + varBlocks + '</div>' +
      '</div>' +
    '</div>' +

  '</div>' +

  /* ══ RIGHT PANEL ══ */
  '<div class="report-panel">' +

    /* period header */
    '<div class="period-header">' +
      '<div>' +
        '<p class="period-title">Período: ' + periodoLabel + '</p>' +
        '<p class="period-meta">Reporte ' + r.frecuenciaMedicion.toLowerCase() + ' · Fecha límite: ' + r.fechaLimite + '</p>' +
      '</div>' +
      '<span class="status-badge status-pending">Pendiente de carga</span>' +
    '</div>' +

    /* avance form */
    '<div class="avance-section">' +
      '<p class="section-heading">' +
        '<svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125" /></svg>' +
        'Reportar avance' +
      '</p>' +
      '<div class="avance-input-wrap">' +
        '<label class="avance-input-label">Valor de avance</label>' +
        '<div class="avance-inp-row">' +
          '<input type="text" class="avance-inp" id="avanceInput" oninput="onAvanceInput(this.value)" placeholder="Ej: ' + indExample + '" autocomplete="off">' +
          '<span class="avance-unit">' + (r.unidadMedida || '—') + '</span>' +
        '</div>' +
        '<p class="avance-hint">Registra el valor obtenido al cierre del período según el método de cálculo del indicador.</p>' +
      '</div>' +
      '<div class="avance-actions">' +
        '<button class="btn btn-primary" id="saveBtn" onclick="saveAvance()" disabled>' +
          '<svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="14" height="14"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>' +
          'Guardar avance' +
        '</button>' +
      '</div>' +
      '<div class="saved-msg" id="savedMsg">' +
        '<svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>' +
        'Avance registrado: <strong style="margin-left:3px"><span id="savedVal"></span>' + uShort + '</strong>' +
      '</div>' +
    '</div>' +

    histHTML +

  '</div>' + /* end right panel */

'</div>' + /* end detail-layout */

/* bottom bar */
'<div class="bottom-bar">' +
  '<p class="bottom-bar-info">Indicador <strong>' + r.id + '</strong> · ' + r.area + ' · ' + r.gerencia + '</p>' +
  '<div class="bottom-bar-actions">' +
    '<button class="btn btn-ghost" onclick="history.back()">' +
      '<svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="13" height="13"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>' +
      'Volver a mis indicadores' +
    '</button>' +
  '</div>' +
'</div>';

  page.innerHTML = html;
})();
</script>
</body>
</html>
